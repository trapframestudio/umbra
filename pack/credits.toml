# Everyone whose work is in Umbra. dev/pack_build.py copies these into the pack
# manifest (the installer's Credits window and UMBRA-CREDITS.txt) and renders
# CREDITS.md from them.
#
#   id       what a [[layer]] in umbra.toml names with credit = "<id>"
#   mod      the mod's name as its author publishes it
#   authors  the people (handles as they use them); [] only when unknown,
#            with notes = "author unknown: <what was checked>"
#   url      the mod's own page ("" when none was found; notes say so)
#   role     base | engine | extra | gamma-optional | baked-models | tool
#   version  optional: the version Umbra ships
#   license  optional: the licence it is redistributed under, when it states one
#   notes    optional: one or two plain sentences, ending with a full stop
#
# Sources: each mod's own files (fomod info.xml and ModuleConfig.xml, readmes,
# credits files, script headers, meta.ini url=), G.A.M.M.A.'s
# modpack_maker_list.txt (pack/gamma/), Umbra Gore & Effects' CREDITS.txt and
# bake report, and the mods' public pages.

# ====================================================================== the base

[[credit]]
id = "gamma"
mod = "S.T.A.L.K.E.R. G.A.M.M.A."
authors = ["Grokitach", "the G.A.M.M.A. team and contributors"]
url = "https://github.com/Grokitach/Stalker_GAMMA"
role = "base"
license = "AGPL-3.0"
notes = "Grok's Automated Modular Modpack for Anomaly. Umbra installs it with stalker-gamma-cli at pinned commits, so each of its 462 addons is downloaded from its author's own page; the full list, with every author and link, is G.A.M.M.A.'s modpack_maker_list.txt (https://github.com/Grokitach/Stalker_GAMMA/blob/main/G.A.M.M.A/modpack_data/modpack_maker_list.txt)."

[[credit]]
id = "anomaly"
mod = "S.T.A.L.K.E.R. Anomaly"
authors = ["Anomaly Developers"]
url = "https://www.moddb.com/mods/stalker-anomaly"
role = "base"
license = "X-Ray engine code: GSC Game World's non-commercial licence"
notes = "The free, standalone game G.A.M.M.A. and Umbra are built on."

[[credit]]
