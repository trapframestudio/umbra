authors = ["Adam Jagosz", "The Tektur Project Authors"]
url = "https://github.com/hyvyys/Tektur"
role = "extra"
license = "OFL-1.1"
notes = "Typeface for Umbra's UI headings and menu buttons, drawn into the game's bitmap fonts in the Umbra mod. Umbra Setup and the launcher are set in it too: they carry one fixed instance of it (width 80, weight 600, named Tektur Narrow SemiBold) with its licence."

