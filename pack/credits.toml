[[credit]]
id = "umbra"
mod = "Umbra"
authors = ["the Umbra team"]
url = ""
role = "extra"
notes = "Umbra's own mod. Its MCM values are G.A.M.M.A.'s, as tested for Umbra. Its look (splashes, fonts, UI repaint) is painted with textures from S.T.A.L.K.E.R. Anomaly's base game (GSC Game World's assets) and changes only what it repaints, on top of G.A.M.M.A.'s UI. The menu's placeholder loop is CS Eden's Dead City picture from G.A.M.M.A.'s loading screens addon; its version line and hryvnia lines change single strings of G.A.M.M.A.'s text (G.A.M.M.A. Massive Text Overhaul Project, SageDaHerb and Dr.Pr1nkos). The UI fonts are drawn from the Tektur and Play typefaces (credited below), with their licences in the mod's licenses folder. Umbra's New Levels patch merges New Levels with G.A.M.M.A. (its spawn with G.A.M.M.A.'s, which carries New Storylines' Hidden Threat storyline, and its dialogs and task guide with G.A.M.M.A.'s), and Stalkers Underground lets stalker squads of every faction explore the labs."

[[credit]]
