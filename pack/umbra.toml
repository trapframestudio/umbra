# Umbra pack definition. dev/pack_build.py reads this, packs every layer from
# the source MO2 instance into content-addressed archives, and writes the
# manifest the installer reads (see README.md, "How a pack is built").

[pack]
name = "Umbra"
version = "0.3.0"
channel = "stable"        # stable | testing

[hosting]
# Where the built pack is published (Backblaze B2, ideally behind Cloudflare so
# downloads cost nothing). The installer is built with this address in it.
# Empty until the bucket exists: the installer then needs --source.
base_url = ""

[source]
# The instance the pack is built from (your tested setup): an Umbra install kept for
# development, apart from any install used to test releases. New mods are added
# and tested there, in its Umbra profile, before they become layers here.
# (Paths relative to this file, or starting with ~.)
mo2 = "~/development/umbra-dev/gamma"
anomaly = "~/development/umbra-dev/anomaly"
profile = "Umbra"

# ------------------------------------------------------------------ G.A.M.M.A.
# Installed by FaithBeam's stalker-gamma-cli, pinned: the CLI release (sha256
# from GitHub's release page), the GAMMA git repos at the commits this pack was
# tested with, and the GAMMA lists as they were installed.
[gamma]
cli_version = "1.41.1"
mo2_profile = "G.A.M.M.A"
modpack_maker_list = "gamma/modpack_maker_list.txt"
modlist = "gamma/modlist.txt"

[gamma.cli.linux-x64]
url = "https://github.com/FaithBeam/stalker-gamma-cli/releases/download/1.41.1/stalker-gamma%2Blinux.x64.AppImage"
sha256 = "f9288f1e2c1d59a59ee5b2ef21ccd8ed16b4558642483e8b1d5e36a64a19e979"

[gamma.cli.win-x64]
url = "https://github.com/FaithBeam/stalker-gamma-cli/releases/download/1.41.1/stalker-gamma%2Bwin.x64.zip"
sha256 = "e7fb059f564bb08da6dab0db98e3cb0f4ec5e47265a79794b4cbd6483c90b84e"

[gamma.repos]   # branch or commit, passed to `config create --<name>-repo-branch`
stalker-gamma = "ab0f743af42a3b3b0b0ee853b3676f5189f7f0d0"
gamma-setup = "cb58077bb9aca5c485702a63821b3381abc8722e"
gamma-large-files = "908f620510858f3c00aa121db9c4ca2c0c8380b0"
teivaz-anomaly-gunslinger = "d31ed61d91629329dec67c81706959ec8b2fd642"

# ------------------------------------------------------------------ the Umbra profile
# The installer makes an MO2 profile "Umbra" next to G.A.M.M.A. (which it never
# changes): G.A.M.M.A.'s profile files, with the load order below. This is the
# co-op profile (xrRazom); MO2 and the "Umbra" Steam shortcut open it.
[profile]
name = "Umbra"
base = "G.A.M.M.A"
# The load order: your tested profile's modlist.txt, snapshotted at build time,
# with these changes. Entries for mods that a fresh install doesn't have are
# dropped by MO2 by itself. Every profile starts from this same list.
drop = [
    "Zone Gore Overhaul 1.6.0 (standalone)",   # an old fallback copy; Umbra ships "Umbra Gore & Effects"
]

# ------------------------------------------------------------------ console settings
# Lines for Anomaly's appdata/user.ltx, shared by every profile (MO2 keeps no
# per-profile copy for Anomaly). Only a key the player's file lacks is added:
# a setting the player has is never changed. Keep this to choices that suit
# any machine; user.ltx is otherwise hardware-specific and is never packed.
[user_ltx]
lines = [
    "r3_msaa st_opt_off",
]

# ------------------------------------------------------------------ options
# A tick box (default = true/false), or pick one (choices + default = a
# choice id; a layer says option = "<option>=<choice>"). The installer
# remembers the picks: running Umbra Setup again keeps them unless changed.
[[option]]
id = "ccon-season"
title = "Season for the grass and trees"
description = "C Consciousness's look for the Zone's grass, bushes and trees. To change it later, pick another in the Umbra launcher; seasons you've had before stay in Mod Organizer 2 (switched off), so switching back needs no download."
default = "autumn"
choices = [
    { id = "spring", title = "Spring" },
    { id = "summer", title = "Summer" },
    { id = "autumn", title = "Autumn" },
    { id = "winter", title = "Dead (winter)" },
]

# ------------------------------------------------------------------ sources
# Archives pinned by sha256. url: dev/pack_build.py --fetch-sources gets it;
# without one, download it by hand from page. A 7z is unpacked once (only the
# folders layers use) into ~/.cache/umbra-src/unpacked with 7-Zip.
[sources.ccon]
file = "~/Downloads/CCon_0.71_Fomod.7z"
page = "https://www.moddb.com/mods/stalker-anomaly/addons/ccon-grass-n-trees"
sha256 = "388533055e91e3168a764748249697aee62a9ba27aba248c50f6b3aaa76d0b48"
version = "0.71"
root = "CCon1.0Fomod"

# xrRazom's author asks that it be downloaded from ModDB (so its downloads are
# counted): Umbra never hosts it. Players' Setup downloads this exact file
# there (or uses the copy in their Downloads folder); its layers say what they
# take from it, as its fomod installs it for G.A.M.M.A.
[sources.xrrazom]
file = "~/Downloads/xrRazom-1.5-Slim.zip"
page = "https://www.moddb.com/mods/xrrazom-stalker-anomaly-co-op/addons/xrrazom-stalker-anomaly-co-op-slim"
download = "https://www.moddb.com/addons/start/314090"
sha256 = "f57d8173d45c32dc9dd4808cde5b3c75e8af90e69b669c694ab879453804fb21"
version = "1.5"
site = "ModDB"
players_download = true

# ------------------------------------------------------------------ layers
# Highest priority first (the top of modlist.txt, the bottom of MO2's left
# pane). folder = the MO2 mod folder in the source instance. target "mods"
# (default) installs into <MO2>/mods/<folder>; "anomaly" copies into the
# Anomaly folder itself (from = a folder inside the source).
# Other sources: files = {"path in the mod" = "file"}; archive = a zip, or
# source = a [sources] id, with archive_root / archive_include, and
# archive_member for an MO2 mod zipped inside it. without_files_of = layer
# ids: leave out every file those layers have (a mod's shared part, minus
# what each choice brings).
# from + files: the folder, plus single files that win over its own.
# profile = only switched on in that profile (every profile lists every
# layer; another profile's layers are switched off). preserve = true (or a
# list of patterns): the player's edits to those files survive updates.
# was = the folder's earlier names: Setup renames a folder an earlier Umbra
# installed (keeping its place and on/off in every profile) instead of
# installing it again beside the old one. Keep old names here for good.
# keep_place = true: the layer stays where the tested profile lists it, instead
# of going on top with the others (a mod G.A.M.M.A.'s mods must win over).
# own_files = a folder in this repo (mods/) with Umbra's own files of the mod:
# the build refuses to pack the instance's folder while they differ
# (dev/deploy_mods.py puts them there).
# credit = the id in credits.toml.

# xrRazom first: its fomod says to give it the highest priority (first = true
# makes the build refuse any layer above it).
[[layer]]
id = "xrrazom"
folder = "xrRazom Co-op"
source = "xrrazom"
first = true
# its fomod: gamedata always, and gamma\gamedata for G.A.M.M.A. ("everyone in a
# session must give the same answer": Umbra always answers G.A.M.M.A.)
take = [["gamedata/", "gamedata/"], ["gamma/gamedata/", "gamedata/"]]
credit = "xrrazom"

# The Umbra mod: Umbra's own changes, in one mod above everything but xrRazom.
# - Your tuned MCM values. xrRazom has no axr_options.ltx, so MCM changes still
#   land here. MO2 writes MCM changes back into this file, so it is the
#   player's after install: an update that ships new values leaves an edited
#   copy alone and puts Umbra's beside it (axr_options.ltx.umbra-new).
# - Umbra's look: splashes, fonts, the UI repaint, the hryvnia and the version
#   line, built by look/ (look/layer.py writes out/Umbra; see look/README.md).
#   It changes only what Umbra changes: repainted UI cells through their
#   texture ids, changed strings by their ids, whole files only where the game
#   names a file itself. G.A.M.M.A.'s UI stays underneath.
[[layer]]
id = "umbra"
folder = "Umbra"
was = ["Umbra Settings"]                 # its name in pack 0.1.0, before the look joined it
from = "../look/out/Umbra"
preserve = ["gamedata/configs/axr_options.ltx"]
credit = "umbra"
[layer.files]
"gamedata/configs/axr_options.ltx" = "~/development/umbra-dev/gamma/mods/Umbra/gamedata/configs/axr_options.ltx"

[[layer]]
id = "zgo"
folder = "Umbra Gore & Effects"
was = ["Zone Gore Overhaul"]                    # its name up to 1.7.1
zgo = true      # ZGO's own release rules (dev/package.py); the bake in the deployed mod goes
                # to umbra-effects/<fingerprint>/ (README: "The prebaked bake")
credit = "zgo"

# HollywoodFX's bullet impacts, muzzle effects and explosions as loose particle files, above
# Particles Cinematic VFX 3.5 (BOTZ YAWM): dev/hfx_layer.py builds the folder in the instance
# from HFX_v3.1.5.zip (no blood, none of HFX's configs; umbra-hfx-layer.json in it lists why).
[[layer]]
id = "hollywoodfx"
folder = "HollywoodFX Impacts - Umbra"
credit = "hollywoodfx"

[[layer]]
id = "glossy-puddles"
folder = "Glossy Puddles"
credit = "glossy-puddles"

# MO2 cut these two folder names short when it first installed their archives
# ("Man I Love Fog v0.3.zip", "Vehicle_Textures_Redux_-_V1.3.1_-_MODDB.7z"); was
# renames those installs.
[[layer]]
id = "fog"
folder = "Man I Love Fog 0.3"
was = ["Man I Love Fog v"]
credit = "fog"

[[layer]]
id = "mhp-hands"
folder = "M.H.P. [Hands pack]"
credit = "mhp-hands"

# C Consciousness: one mod per season (the mod's own installer picks one),
# above the shared part. Every season brings the same 202 tree and grass
# textures; Dead also brings its own versions of the shared dead-tree ones.
[[layer]]
id = "ccon-spring"
option = "ccon-season=spring"
folder = "CCon Season - Spring"
source = "ccon"
archive_root = "Seasons/Spring"
credit = "ccon-grass"

[[layer]]
id = "ccon-summer"
option = "ccon-season=summer"
folder = "CCon Season - Summer"
source = "ccon"
archive_root = "Seasons/Summer"
credit = "ccon-grass"

[[layer]]
id = "ccon-autumn"
option = "ccon-season=autumn"
folder = "CCon Season - Autumn"
source = "ccon"
archive_root = "Seasons/Autumn"
credit = "ccon-grass"

[[layer]]
id = "ccon-winter"
option = "ccon-season=winter"
folder = "CCon Season - Dead (winter)"
source = "ccon"
archive_root = "Seasons/Dead"
credit = "ccon-grass"

# The shared part, as installed here (barks, red/dead trees, grass bump maps,
# the Overgrown grass, and level.details for Limansk and the Hospital that the
# archive doesn't have), minus the season textures (this install has Autumn's).
[[layer]]
id = "ccon-grass"
folder = "C Consciousness Grass and Trees Overhaul – Seasons 0.71"
without_files_of = ["ccon-autumn"]
credit = "ccon-grass"

[[layer]]
id = "nitpicker"
folder = "REPACK NITPICKER 1.2"
credit = "nitpicker"

[[layer]]
id = "misery-like"
folder = "Misery-like Vanilla v0.4"
credit = "misery-like"

[[layer]]
id = "vehicle-textures"
folder = "Vehicle Textures Redux 1.3.1"
was = ["Vehicle_Textures_Redux_"]
credit = "vehicle-textures"

[[layer]]
id = "ixrtr"
folder = "IXRTR"
credit = "ixrtr"

[[layer]]
id = "atmospherics"
folder = "Atmospherics 2.69 RC8"
credit = "atmospherics"

[[layer]]
id = "safe-haven"
folder = "Custom Base Safe Haven"
credit = "safe-haven"

# Umbra's patch for New Levels (below): the merged all.spawn (G.A.M.M.A.'s, with New
# Storylines' Hidden Threat, plus New Levels'), dialogs.xml and tasks_guide.script, and its
# labs open to everyone. See mods/README.md.
[[layer]]
id = "new-levels-patch"
folder = "New Levels - Umbra Patch"
own_files = "../mods/New Levels - Umbra Patch"
credit = "umbra"

# Stalker squads of every faction explore the labs and underground levels (mods/README.md).
[[layer]]
id = "stalkers-underground"
folder = "Umbra - Stalkers Underground"
own_files = "../mods/Umbra - Stalkers Underground"
credit = "umbra"

# New Levels and its two add-ons stay at the bottom of the load order, where the tested
# profile has them: G.A.M.M.A.'s mods win over their files. New Levels' own all.spawn,
# dialogs.xml and tasks_guide.script are hidden there (*.mohidden, so never packed): the patch
# above has the merged ones. A new game is needed (the spawn changed).
[[layer]]
id = "new-levels-pda-maps"
folder = "New Levels - High Res PDA Maps"
keep_place = true
url = "https://www.moddb.com/mods/stalker-anomaly/addons/high-resolution-maps"
credit = "high-res-pda-maps"

[[layer]]
id = "new-levels-dao"
folder = "New Levels - DAO Patch 1.1"
keep_place = true
credit = "new-levels-dao"

[[layer]]
id = "new-levels"
folder = "New Levels 0.53"
keep_place = true
url = "https://www.moddb.com/mods/stalker-anomaly/addons/promzone-level"
credit = "new-levels"

# xrRazom's engine: the archive's Anomaly folder (bin AND gamedata) goes into the
# game folder (the originals are backed up), as its fomod tells players to do.
[[layer]]
id = "xrrazom-engine"
target = "anomaly"
source = "xrrazom"
take = [["Anomaly/", ""]]
credit = "xrrazom"
